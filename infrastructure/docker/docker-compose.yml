# ============================================================================
# Digital Lending Platform - development stack.
#
# Run from the repository root:  docker compose up -d
# The root docker-compose.yml includes this file, so image tags, volumes and
# service wiring are all maintained here.
#
# Optional profiles:
#   docker compose --profile gateway up -d      adds the Nginx API gateway
#   docker compose --profile monitoring up -d   adds Prometheus, Grafana, Loki
#
# Image tags are pinned. They must stay in step with
# backend/digital-lending-api/src/test/java/com/naztech/lending/support/PlatformContainers.java
# so that tests run against the versions the platform deploys.
# ============================================================================
name: digital-lending-platform

services:

  postgres:
    image: postgres:17-alpine
    container_name: dlp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digital_lending}
      POSTGRES_USER: ${POSTGRES_USER:-dlp_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Deterministic collation: ordering must not vary between environments.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dlp_owner} -d ${POSTGRES_DB:-digital_lending}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [dlp]

  redis:
    image: redis:7-alpine
    container_name: dlp-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [dlp]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: dlp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [dlp]

  # One-shot: provisions the document bucket the way production would, so the
  # application never needs bucket-creation rights of its own.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: dlp-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set dlp http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing dlp/$$STORAGE_BUCKET &&
      mc anonymous set none dlp/$$STORAGE_BUCKET &&
      mc version enable dlp/$$STORAGE_BUCKET &&
      echo 'bucket ready:' $$STORAGE_BUCKET
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-dlp-documents}
    restart: "no"
    networks: [dlp]

  backend:
    build:
      context: ../../backend/digital-lending-api
      dockerfile: Dockerfile
    image: dlp/digital-lending-api:dev
    container_name: dlp-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_DB: ${POSTGRES_DB:-digital_lending}
      DLP_DB_USERNAME: ${POSTGRES_USER:-dlp_owner}
      DLP_DB_PASSWORD: ${POSTGRES_PASSWORD}
      DLP_REDIS_PASSWORD: ${REDIS_PASSWORD}
      DLP_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      DLP_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      DLP_STORAGE_BUCKET: ${STORAGE_BUCKET:-dlp-documents}
      # The bucket is provisioned by minio-init, exactly as it would be in production.
      DLP_STORAGE_AUTO_CREATE_BUCKET: "false"
      DLP_CORS_ORIGINS: ${PORTAL_ORIGIN:-http://localhost:3000}
      DLP_LOG_LEVEL: ${BACKEND_LOG_LEVEL:-DEBUG}
      JAVA_TOOL_OPTIONS: ${BACKEND_JAVA_OPTS:--XX:MaxRAMPercentage=75.0}
    ports:
      # Only the API port is published. Actuator stays on 9091 inside the network.
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9091/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [dlp]

  web:
    build:
      context: ../../web/bank-portal
      dockerfile: Dockerfile
    image: dlp/bank-portal:dev
    container_name: dlp-bank-portal
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # The browser never calls Spring Boot directly: the portal proxies through
      # its own route handlers, so the API stays reachable only inside the network.
      BACKEND_INTERNAL_URL: http://backend:8080
      NEXT_PUBLIC_APP_ENV: docker
    ports:
      - "${PORTAL_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/bff/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [dlp]

  nginx:
    image: nginx:1.29-alpine
    container_name: dlp-gateway
    profiles: [gateway]
    restart: unless-stopped
    depends_on:
      - backend
      - web
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "${GATEWAY_PORT:-80}:80"
    networks: [dlp]

  # ---- Observability (docker compose --profile monitoring up -d) -------------

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: dlp-prometheus
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks: [dlp]

  loki:
    image: grafana/loki:3.6.15
    container_name: dlp-loki
    profiles: [monitoring]
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ../monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks: [dlp]

  promtail:
    image: grafana/promtail:3.6.11
    container_name: dlp-promtail
    profiles: [monitoring]
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ../monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks: [dlp]

  grafana:
    image: grafana/grafana:12.4.8
    container_name: dlp-grafana
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - loki
    networks: [dlp]

volumes:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data:
  loki-data:

networks:
  dlp:
    name: dlp-network
    driver: bridge
