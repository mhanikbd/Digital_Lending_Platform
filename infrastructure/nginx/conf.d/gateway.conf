upstream dlp_backend {
    server backend:8080;
    keepalive 16;
}

upstream dlp_portal {
    server web:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Actuator is bound to an internal management port and is deliberately not
    # proxied. Metrics are scraped inside the container network only.

    location /api/ {
        proxy_pass         http://dlp_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Generate a correlation id at the edge when the client did not send one,
        # so a request is traceable even before it reaches the application.
        proxy_set_header   X-Correlation-Id  $http_x_correlation_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    location / {
        proxy_pass         http://dlp_portal;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
