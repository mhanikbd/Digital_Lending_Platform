# API gateway for the development stack. Enabled with:
#   docker compose --profile gateway up -d
#
# It terminates a single entry point so the portal and the API share an origin,
# and it is where request-size limits, timeouts and TLS termination live in a
# deployed environment.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # The correlation id is part of every access log line so gateway logs can be
    # joined to application logs for a single request.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" corr="$http_x_correlation_id" rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # Document uploads (NID scans, statements) are capped here as well as in the
    # application, so oversized bodies are rejected before they reach the JVM.
    client_max_body_size 25m;
    client_body_timeout  30s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    include /etc/nginx/conf.d/*.conf;
}
